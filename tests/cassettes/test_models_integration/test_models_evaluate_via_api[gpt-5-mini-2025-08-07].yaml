    body: '{"messages":[{"content":"\nBreak down each hypothesis into statements,
      if hypothesis is complex. Else if the hypothesis is already a single statement,
      return it unchanged as a single statement.\n\nA statement is a declarative independent
      self-contained non-overlapping substring forming a complete sentence derived
      from the hypothesis.\n\nSingle words, signs, numbers, links, etc. are not statements.\n\nWhen
      a hypothesis contains an enumeration or list, split it so that each item in
      the list becomes a separate statement. Preserve the relationship from the parent
      clause in each statement.\n\nThe output list must contain exactly as many items
      as there are input hypotheses, in the same order: the first item corresponds
      to the first hypothesis, the second item to the second hypothesis, and so on.\n\nExamples:\nInput
      hypotheses (JSON array of strings, one hypothesis per element):\n[\n  \"The
      sky is blue and the grass is green.\",\n  \"Water boils at 100 degrees Celsius.\",\n  \"The
      company has offices in Paris, London, and Berlin.\"\n]\n\nExpected output:\n{\n  \"hypothesis_statements\":
      [\n    {\n      \"statements\": [\n        \"The sky is blue.\",\n        \"The
      grass is green.\"\n      ]\n    },\n    {\n      \"statements\": [\n        \"Water
      boils at 100 degrees Celsius.\"\n      ]\n    },\n    {\n      \"statements\":
      [\n        \"The company has an office in Paris.\",\n        \"The company has
      an office in London.\",\n        \"The company has an office in Berlin.\"\n      ]\n    }\n  ]\n}\n\nRequest:\nInput
      hypotheses (JSON array of strings, one hypothesis per element):\n[\n  \"The
      Earth has a diameter of about 12,742 km.\"\n]","role":"user"}],"model":null,"stream":true,"stream_options":{"include_usage":true}}'
