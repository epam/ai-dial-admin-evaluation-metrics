- request:
    body: "{\"messages\":[{\"content\":\"\\nNatural language inference is the task
      of determining whether the hypothesis is an entailment, contradiction, or neutral
      with respect to the premise.\\nA hypothesis is a list of statements provided
      below.\\n\\nThe name of the document from which the premise was derived is also
      provided (if available).\\n\\nA statement is considered an entailment if it
      is a paraphrase of information expressed in the premise.\\nA statement is considered
      a contradiction if it is logically inconsistent with the premise.\\nA statement
      is considered neutral if the premise neither supports nor contradicts it, or
      if the statement contains information the premise does not address.\\n\\nA statement
      can be entailed even if the premise contains more information than the statement
      covers \u2014 a statement that restates only part of the premise, or condenses
      it, is still entailment, as long as it does not introduce new information.\\n\\nImportant:
      Do not rely on factual world knowledge or logical inference chains to establish
      entailment \u2014 if a fact is not stated in the premise, it is not entailed.
      However, recognizing synonyms and paraphrases is not inference: it is identifying
      the same meaning expressed in different words, which is a core part of determining
      entailment.\\n\\nFor each statement:\\nProvide a brief short(1 sentence) explanation
      of whether the statement is an entailment, contradiction or neutral with respect
      to the premise.\\nAssign tags based on your explanation: \\\"ENT\\\" for entailment,
      \\\"CONT\\\" for contradiction, \\\"NEUT\\\" for neutral or if none of the above
      tags apply.\\n\\nFormat your response in JSON. You must return only JSON.\\n\\nFor
      example, given the following request:\\n{\\n  \\\"document_name\\\": \\\"biology_article\\\",\\n
      \ \\\"premise\\\": \\\"I am a biology graduate and I work at a tech company.\\\",\\n
      \ \\\"statements\\\": [\\n    \\\"I am a graduate.\\\",\\n    \\\"I work at
      a hospital.\\\",\\n    \\\"I am employed at a tech firm.\\\"\\n  ]\\n}\\nthe
      expected output is:\\n{\\n  \\\"statement_inference\\\": [\\n    {\\n      \\\"explanation\\\":
      \\\"It is true that I am a graduate.\\\",\\n      \\\"tag\\\": \\\"ENT\\\"\\n
      \   },\\n    {\\n      \\\"explanation\\\": \\\"Premise states I work at a tech
      company, not a hospital.\\\",\\n      \\\"tag\\\": \\\"CONT\\\"\\n    },\\n
      \   {\\n      \\\"explanation\\\": \\\"Employed at a tech firm is a paraphrase
      of working at a tech company.\\\",\\n      \\\"tag\\\": \\\"ENT\\\"\\n    }\\n
      \ ]\\n}\\n\\nRequest:\\n{\\n  \\\"premise\\\": \\\"The Earth is the third planet
      from the Sun. The diameter of the Earth is approximately 12,742 kilometers.\\\",\\n
      \ \\\"statements\\\": [\\n    \\\"The Earth has a diameter of about 12,742 km.\\\"\\n
      \ ]\\n}\",\"role\":\"user\"}],\"model\":null,\"stream\":true,\"stream_options\":{\"include_usage\":true}}"
